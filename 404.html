<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | SOX IT Audit Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{--bg:#f8f9fb;--surface:#fff;--surface-2:#f0f2f7;--border:#e2e6ef;--text:#0f1623;--text-2:#3d4a63;--text-3:#6b7a99;--accent:#1a5cff;--accent-bg:#eef3ff;--accent-text:#1a3d99;--success:#0d9461;--danger:#cc2929;--radius:10px;--nav-h:64px}
  [data-theme="dark"]{--bg:#0d1117;--surface:#161b27;--surface-2:#1e2538;--border:#2a3148;--text:#e8edf7;--text-2:#a8b4cc;--text-3:#6b7a99;--accent:#4d85ff;--accent-bg:#0f1e40;--accent-text:#7aaeff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
  .code{font-size:6rem;font-weight:800;color:var(--border);line-height:1;letter-spacing:-.04em;margin-bottom:.5rem}
  .title{font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:.75rem}
  .sub{font-size:.9rem;color:var(--text-2);max-width:420px;line-height:1.7;margin-bottom:2rem}
  .page-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;width:100%;max-width:600px;margin-bottom:2rem}
  .page-links a{display:flex;align-items:center;gap:7px;padding:.7rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:.82rem;font-weight:500;color:var(--text-2);text-decoration:none;transition:all .15s ease}
  .page-links a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  .home-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:var(--accent);color:#fff;border-radius:var(--radius);font-size:.875rem;font-weight:600;text-decoration:none}
  .home-btn:hover{background:#1348cc}
  .countdown{font-size:.8rem;color:var(--text-3);margin-top:1.5rem}
  #sec{font-weight:700;color:var(--accent)}
</style>
</head>
<body>

<div class="code">404</div>
<h1 class="title">Page not found</h1>
<p class="sub">This page doesn't exist — but you're probably looking for one of these. You'll be redirected to the home page in <span id="sec">5</span> seconds.</p>

<div class="page-links">
  <a href="/sox-itgc-audit/"><i class="ti ti-home"></i> Home</a>
  <a href="/sox-itgc-audit/pages/workpapers.html"><i class="ti ti-file-description"></i> Workpapers</a>
  <a href="/sox-itgc-audit/pages/app-controls.html"><i class="ti ti-layers-difference"></i> App Controls</a>
  <a href="/sox-itgc-audit/pages/mistakes.html"><i class="ti ti-alert-triangle"></i> Common Mistakes</a>
  <a href="/sox-itgc-audit/pages/remediation.html"><i class="ti ti-tool"></i> Remediation</a>
  <a href="/sox-itgc-audit/pages/cyber-sox.html"><i class="ti ti-arrows-cross"></i> Cyber → SOX</a>
</div>

<a href="/sox-itgc-audit/" class="home-btn"><i class="ti ti-arrow-left"></i> Go home now</a>

<p class="countdown">Redirecting in <span id="sec2">5</span>s…</p>

<script>
  // Theme
  const t = localStorage.getItem('sox-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);

  // Countdown + redirect
  let s = 5;
  const els = [document.getElementById('sec'), document.getElementById('sec2')];
  const iv = setInterval(() => {
    s--;
    els.forEach(e => { if (e) e.textContent = s; });
    if (s <= 0) { clearInterval(iv); window.location.href = '/sox-itgc-audit/'; }
  }, 1000);
</script>
</body>
</html>
